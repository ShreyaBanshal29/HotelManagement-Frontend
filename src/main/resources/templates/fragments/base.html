<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- ── HEAD fragment ──────────────────────────────────────────────────── -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | LuxStay Hotels'">LuxStay Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<!-- ── NAVBAR fragment ────────────────────────────────────────────────── -->
<nav th:fragment="navbar">
    <div class="nav-inner">
        <a th:href="@{/}" class="nav-logo">
            <span class="nav-logo-icon">🏨</span> LuxStay
        </a>
        <div class="nav-links">
            <a th:href="@{/}" class="nav-link">Team</a>
            <a th:href="@{/hotels}" class="nav-link">Hotels</a>
        </div>
    </div>
</nav>

<!-- ── FOOTER fragment ────────────────────────────────────────────────── -->
<footer th:fragment="footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <span>🏨</span> LuxStay Hotels
        </div>
        <div class="footer-sub">Hotel Management System &copy; 2025</div>
    </div>
</footer>

</html>
