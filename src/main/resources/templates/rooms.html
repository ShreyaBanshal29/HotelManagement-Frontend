<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rooms</title>
	<style>
	    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
	    body { background: #f5f5f5; }
	    .container { max-width: 1100px; margin: 40px auto; background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
	    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
	    .page-header h1 { font-size: 1.8em; font-weight: 700; color: #111; }
	    .back-link { color: #1a73e8; text-decoration: none; font-weight: 500; }
	    .back-link:hover { text-decoration: underline; }
	    table { width: 100%; border-collapse: collapse; }
	    thead tr { background: #f0f0f0; }
	    th { padding: 13px 16px; text-align: left; font-size: 14px; font-weight: 600; color: #333; border-bottom: 1px solid #e0e0e0; }
	    td { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #eee; color: #444; }
	    tbody tr:hover { background: #fafafa; }
	    .empty-msg { text-align: center; padding: 40px; color: #999; font-size: 15px; }
	    .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
	    .pagination a { padding: 6px 10px; text-decoration: none; color: #1a73e8; font-size: 14px; }
	    .pagination a:hover { text-decoration: underline; }
	    .pagination a.active { font-weight: bold; color: #111; }
	</style>
</head>
<body>

	<div class="container">

	    <div class="page-header">
	        <h1>Rooms</h1>
	        <a href="/roomtypes" class="back-link">← Back to Room Types</a>
	    </div>

	    <table>
	        <thead>
	            <tr>
	                <th>Room Number</th>
	                <th>Status</th>
	                <th>Room Type</th>
	                <th>Hotel Name</th>
	                <th>Location</th>
	            </tr>
	        </thead>
	        <tbody>
	            <tr th:each="room : ${rooms}"
	                th:if="${room.roomNumber != null}">
	                <td th:text="${room.roomNumber}"></td>
	                <td th:text="${room.hotel != null ? (room.isAvailable ? 'Available' : 'Not Available') : ''}"></td>
	                <td th:text="${room.roomType != null ? room.roomType.typeName : ''}"></td>
	                <td th:text="${room.hotel != null ? room.hotel.name : ''}"></td>
	                <td th:text="${room.hotel != null ? room.hotel.location : ''}"></td>
	            </tr>
	            <tr th:if="${rooms == null or #lists.isEmpty(rooms) or rooms[0].roomNumber == null}">
	                <td colspan="5" class="empty-msg">No rooms found</td>
	            </tr>
	        </tbody>
	    </table>

	    <div class="pagination" th:if="${totalPages > 1}">
	        <a th:if="${currentPage > 0}"
	           th:href="@{'/rooms/byRoomId/' + ${roomTypeId}(page=${currentPage - 1})}">
	           « Prev
	        </a>
	        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
	            <a th:href="@{'/rooms/byRoomId/' + ${roomTypeId}(page=${i})}"
	               th:text="${i + 1}"
	               th:classappend="${i == currentPage} ? ' active' : ''">
	            </a>
	        </span>
	        <a th:if="${currentPage < totalPages - 1}"
	           th:href="@{'/rooms/byRoomId/' + ${roomTypeId}(page=${currentPage + 1})}">
	           Next »
	        </a>
	    </div>

	</div>

</body>
</html>
