<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${hotel.name} + ' | LuxStay Hotels'">Hotel Detail | LuxStay Hotels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f5f5f5; }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 1.8em;
            font-weight: 700;
            color: #111;
            margin-bottom: 6px;
        }

        .hotel-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #666;
        }

        .back-link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            margin-top: 4px;
        }
        .back-link:hover { text-decoration: underline; }

        .info-box {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .section-heading {
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .section-heading h2 {
            font-size: 1.2em;
            font-weight: 700;
            color: #111;
        }

        table { width: 100%; border-collapse: collapse; }
        thead tr { background: #f0f0f0; }
        th {
            padding: 13px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }
        td {
            padding: 13px 16px;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            color: #444;
        }
        tbody tr:hover { background: #fafafa; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-available { background: #e6f4ea; color: #2d7a3a; }
        .badge-occupied  { background: #fce8e6; color: #c0392b; }

        .empty-msg {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 15px;
            background: #fafafa;
            border-radius: 8px;
        }
    </style>
</head>

<body>
<div class="container">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 th:text="${hotel.name}">Hotel Name</h1>
            <div class="hotel-meta">
                <span>📍 <span th:text="${hotel.location}">Location</span></span>
                <span>🛏️ <span th:text="${rooms != null ? #lists.size(rooms) + ' Rooms' : '0 Rooms'}"></span></span>
            </div>
        </div>
        <a th:href="@{/hotels(location=${location}, type='rooms')}" class="back-link">← Back to Hotels</a>
    </div>

    <!-- Hotel Description -->
    <div class="info-box" th:if="${hotel.description != null and !#strings.isEmpty(hotel.description)}">
        <p th:text="${hotel.description}"></p>
    </div>

    <!-- Rooms Section -->
    <div class="section-heading">
        <h2>Rooms</h2>
    </div>

    <!-- No rooms -->
	<div th:if="${rooms == null or #lists.isEmpty(rooms)}" class="empty-msg">
	    No rooms found for this hotel.
	</div>

    <!-- Rooms Table -->
    <table th:unless="${rooms == null or #lists.isEmpty(rooms)}">
        <thead>
            <tr>
                <th>Room Number</th>
                <th>Status</th>
                <th>Room Type</th>
                <th>Max Occupancy</th>
                <th>Price / Night</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="room : ${rooms}" th:if="${room.roomNumber != null}">
                <td th:text="${room.roomNumber}" style="font-weight: 600; color: #1a73e8;"></td>
                <td>
                    <span th:if="${room.isAvailable}" class="badge badge-available">Available</span>
                    <span th:unless="${room.isAvailable}" class="badge badge-occupied">Occupied</span>
                </td>
                <td th:text="${room.roomType != null ? room.roomType.typeName : '—'}"></td>
                <td th:text="${room.roomType != null ? room.roomType.maxOccupancy + ' guests' : '—'}"></td>
                <td>
                    <span th:if="${room.roomType != null}">
                        ₹ <span th:text="${#numbers.formatDecimal(room.roomType.pricePerNight, 1, 'COMMA', 2, 'POINT')}"></span>
                    </span>
                    <span th:unless="${room.roomType != null}">—</span>
                </td>
                <td th:text="${room.roomType != null and room.roomType.description != null ? room.roomType.description : '—'}"></td>
            </tr>
        </tbody>
    </table>

</div>
</body>
</html>
