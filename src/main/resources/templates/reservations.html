<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f5f5f5; }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-header h1 { font-size: 1.8em; font-weight: 700; color: #111; }

        .btn-add {
            padding: 9px 20px;
            background: #1a73e8;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-add:hover { background: #1558b0; }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-success { background: #e6f4ea; color: #2d7a3a; }
        .alert-error { background: #fce8e6; color: #c0392b; }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            background: #f0f4ff;
            border: 1px solid #d0dbff;
            border-radius: 8px;
            padding: 14px 18px;
            flex-wrap: wrap;
        }

        .search-bar select, .search-bar input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .search-bar input { min-width: 250px; flex: 1; }
        .search-bar select:focus, .search-bar input:focus { outline: none; border-color: #1a73e8; }

        .btn-go {
            padding: 8px 22px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-go:hover { background: #1558b0; }

        .btn-clear {
            padding: 8px 16px;
            background: white;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-clear:hover { background: #f0f0f0; }

        table { width: 100%; border-collapse: collapse; }
        thead tr { background: #f0f0f0; }
        th { padding: 13px 16px; text-align: left; font-size: 14px; font-weight: 600; color: #333; border-bottom: 1px solid #e0e0e0; }
        td { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #eee; color: #444; }
        tbody tr:hover { background: #fafafa; cursor: pointer; }

        .guest-name { color: #1a73e8; font-weight: 600; }
        .muted { color: #999; font-size: 12px; margin-top: 2px; }

        .btn-edit {
            background: #f5a623;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }
        .btn-edit:hover { background: #d4891a; }

        .empty-msg { text-align: center; padding: 50px; color: #999; font-size: 15px; }

		.pagination { display: flex; justify-content: center; gap: 6px; margin-top: 24px; flex-wrap: wrap; }
		.pagination a { padding: 7px 13px; border: 1px solid #ddd; color: #333; text-decoration: none; border-radius: 4px; font-size: 14px; }
		.pagination a:hover { background: #f0f0f0; }
		.pagination a.active { background: #1a73e8; color: white; border-color: #1a73e8; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/base :: navbar}"></nav>

<div class="container">

    <div class="page-header">
        <h1>Reservations</h1>
        <a th:href="@{/reservations/new}" class="btn-add">+ New Reservation</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/reservations}" method="get" class="search-bar">
        <select name="filterBy">
            <option value="guestName" th:selected="${filterBy == 'guestName'}">Guest Name</option>
            <option value="guestPhone" th:selected="${filterBy == 'guestPhone'}">Guest Phone</option>
            <option value="guestEmail" th:selected="${filterBy == 'guestEmail'}">Guest Email</option>
            <option value="checkInDate" th:selected="${filterBy == 'checkInDate'}">Check In Date</option>
            <option value="checkOutDate" th:selected="${filterBy == 'checkOutDate'}">Check Out Date</option>
            <option value="roomId" th:selected="${filterBy == 'roomId'}">Room ID</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search exact value, dates as YYYY-MM-DD">
        <button type="submit" class="btn-go">Search</button>
        <a th:href="@{/reservations}" class="btn-clear">Clear</a>
    </form>

    <table>
        <thead>
            <tr>
                <th>Guest</th>
                <th>Contact</th>
                <th>Stay</th>
                <th>Room</th>
                <th>Hotel</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reservation : ${reservations}"
                th:onclick="|location.href='@{/reservations/{id}(id=${reservation.reservationId})}'|">
                <td>
                    <span class="guest-name" th:text="${reservation.guestName}"></span>
                </td>
                <td>
                    <div th:text="${reservation.guestPhone}"></div>
                    <div class="muted" th:text="${reservation.guestEmail}"></div>
                </td>
                <td>
                    <div th:text="${reservation.checkInDate}"></div>
                    <div class="muted" th:text="'to ' + ${reservation.checkOutDate}"></div>
                </td>
                <td>
                    <span th:if="${reservation.room != null}"
                          th:text="'Room ' + ${reservation.room.roomNumber} + ' (#' + ${reservation.room.roomId} + ')'"></span>
                    <span th:unless="${reservation.room != null}">Not assigned</span>
                </td>
                <td th:text="${reservation.room != null and reservation.room.hotel != null ? reservation.room.hotel.name : 'Not available'}"></td>
                <td onclick="event.stopPropagation()">
                    <a th:href="@{/reservations/{id}/edit(id=${reservation.reservationId})}" class="btn-edit">Edit</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(reservations)}">
                <td colspan="6" class="empty-msg">No reservations found.</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/reservations(page=${currentPage - 1}, filterBy=${filterBy}, keyword=${keyword})}">« Prev</a>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/reservations(page=${i}, filterBy=${filterBy}, keyword=${keyword})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
        </span>
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/reservations(page=${currentPage + 1}, filterBy=${filterBy}, keyword=${keyword})}">Next »</a>
    </div>

</div>

<footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
