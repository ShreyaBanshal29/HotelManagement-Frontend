<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotel Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f5f5f5; }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            background: white;
            border-radius: 8px;
            padding: 24px 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .page-header h1 {
            font-size: 1.8em;
            font-weight: 700;
            color: #111;
        }

        .page-header p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
        }

        .card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.13);
            transform: translateY(-2px);
        }

		.card img {
		    width: 100%;
		    height: 200px;
		    object-fit: cover;
		    object-position: center top;
		}

        .card-body {
            padding: 16px 18px;
            border-top: 1px solid #f0f0f0;
        }

        .card-name {
            font-size: 15px;
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 13px;
            color: #888;
        }

        .card-arrow {
            font-size: 13px;
            color: #1a73e8;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <nav th:replace="~{fragments/base :: navbar}"></nav>

    <div class="container">

        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Select a module to get started</p>
        </div>

        <div class="grid">

            <a class="card" href="/hotels?type=reviews">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945">
                <div class="card-body">
                    <div class="card-name">Chirag</div>
                    <div class="card-desc">Hotel Reviews</div>
                    <div class="card-arrow">View →</div>
                </div>
            </a>

            <a class="card" href="/amenities">
                <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
                <div class="card-body">
                    <div class="card-name">Riddhi</div>
                    <div class="card-desc">Amenities</div>
                    <div class="card-arrow">View →</div>
                </div>
            </a>

            <a class="card" href="/roomtypes">
                <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427">
                <div class="card-body">
                    <div class="card-name">Shreya</div>
                    <div class="card-desc">Room Types</div>
                    <div class="card-arrow">View →</div>
                </div>
            </a>

            <a class="card" href="/hotels?type=rooms">
                <img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39">
                <div class="card-body">
                    <div class="card-name">Tryambakesh</div>
                    <div class="card-desc">Hotel Rooms</div>
                    <div class="card-arrow">View →</div>
                </div>
            </a>

            <a class="card" href="/hotels?type=amenities">
                <img src="https://images.unsplash.com/photo-1551776235-dde6d4829808">
                <div class="card-body">
                    <div class="card-name">Ishank</div>
                    <div class="card-desc">Hotel Amenities</div>
                    <div class="card-arrow">View →</div>
                </div>
            </a>

            <a class="card" href="/reservations">
                <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d">
                <div class="card-body">
                    <div class="card-name">Kush</div>
                    <div class="card-desc">Reservations</div>
                    <div class="card-arrow">View →</div>
                </div>
            </a>

        </div>
    </div>

    <footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
