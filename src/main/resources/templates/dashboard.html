<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotel Management</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body { background: #f5f5f5; }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .card-title {
            padding: 12px;
            font-weight: 600;
            color: #1a73e8;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Group-1</h1>
    <h2>Hotel Management</h2>

    <div class="grid">

        <div class="card" onclick="location.href='/hotels?type=reviews'">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945">
            <div class="card-title">Chirag</div>
        </div>

        <div class="card" onclick="location.href='/amenities'">
            <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
            <div class="card-title">Riddhi</div>
        </div>

        <div class="card" onclick="location.href='/roomtypes'">
            <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427">
            <div class="card-title">Shreya</div>
        </div>

        <div class="card" onclick="location.href='/hotels?type=rooms'">
            <img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39">
            <div class="card-title">Tryambakesh</div>
        </div>

       <div class="card" onclick="location.href='/hotels?type=amenities'">
            <img src="https://images.unsplash.com/photo-1551776235-dde6d4829808">
            <div class="card-title">Ishank</div>
        </div>

        <div class="card" onclick="location.href='/reservations'">
            <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d">
            <div class="card-title">Kush</div>
        </div>

    </div>

</div>

</body>
</html>
