<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservation Detail</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f5f5f5; }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            background: white;
            border-radius: 8px;
            padding: 20px 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 { font-size: 1.8em; font-weight: 700; color: #111; }

        .back-link { color: #1a73e8; text-decoration: none; font-weight: 500; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .grid .full-width {
            grid-column: 1 / -1;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 24px 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .panel h2 {
            font-size: 1.1em;
            font-weight: 700;
            color: #111;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        dl { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; }

        dt { font-size: 13px; font-weight: 600; color: #888; align-self: center; }
        dd { font-size: 14px; color: #333; align-self: center; }

        .muted { color: #999; font-size: 14px; padding: 10px 0; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/base :: navbar}"></nav>

<div class="container">

    <div class="page-header">
        <h1 th:text="${reservation != null ? reservation.guestName : 'Reservation Detail'}"></h1>
        <a th:href="@{/reservations}" class="back-link">← Back to Reservations</a>
    </div>

    <div class="grid">

        <!-- Guest -->
        <div class="panel">
            <h2>Guest</h2>
            <dl>
                <dt>Name</dt>
                <dd th:text="${reservation.guestName}"></dd>
                <dt>Email</dt>
                <dd th:text="${reservation.guestEmail ?: 'Not available'}"></dd>
                <dt>Phone</dt>
                <dd th:text="${reservation.guestPhone}"></dd>
                <dt>Check In</dt>
                <dd th:text="${reservation.checkInDate}"></dd>
                <dt>Check Out</dt>
                <dd th:text="${reservation.checkOutDate}"></dd>
            </dl>
        </div>

        <!-- Room -->
        <div class="panel">
            <h2>Room</h2>
            <dl th:if="${room != null}">
                <dt>Room ID</dt>
                <dd th:text="'#' + ${room.roomId}"></dd>
                <dt>Room Number</dt>
                <dd th:text="${room.roomNumber}"></dd>
                <dt>Status</dt>
                <dd th:text="${room.isAvailable} ? 'Available' : 'Not Available'"></dd>
                <dt>Type</dt>
                <dd th:text="${roomType != null ? roomType.typeName : 'Not assigned'}"></dd>
                <dt>Price / Night</dt>
                <dd th:text="${roomType != null ? '₹' + roomType.pricePerNight : 'Not available'}"></dd>
            </dl>
            <p th:unless="${room != null}" class="muted">No room information found.</p>
        </div>

        <!-- Hotel -->
        <div class="panel full-width">
            <h2>Hotel</h2>
            <dl th:if="${hotel != null}">
                <dt>Hotel ID</dt>
                <dd th:text="'#' + ${hotel.hotelId}"></dd>
                <dt>Name</dt>
                <dd th:text="${hotel.name}"></dd>
                <dt>Location</dt>
                <dd th:text="${hotel.location}"></dd>
                <dt>Description</dt>
                <dd th:text="${hotel.description}"></dd>
            </dl>
            <p th:unless="${hotel != null}" class="muted">No hotel information found.</p>
        </div>

    </div>
</div>

<footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
