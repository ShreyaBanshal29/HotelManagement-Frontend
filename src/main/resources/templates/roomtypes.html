<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Types</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        h2 {
			margin-top: 10px;
            margin-bottom: 20px;
        }
		

		.container {
		    max-width: 1200px;
		    margin: 40px auto;
		    background: white;
		    border-radius: 8px;
		    padding: 30px;
		    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
		}

        .btn {
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
			border: 1px solid #007bff;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
		.search-form {
		    display: flex;
		    gap: 10px;
		    align-items: center;
		    flex-wrap: wrap;
		    margin: 15px 0 20px 0;
		}

		.search-form input {
		    padding: 10px 12px;
		    border: 1px solid #ccc;
		    border-radius: 6px;
		    font-size: 14px;
		    min-width: 180px;
		    transition: all 0.2s ease;
		}

		.search-form input:focus {
		    border-color: #007bff;
		    outline: none;
		    box-shadow: 0 0 4px rgba(0,123,255,0.3);
		}

		.btn-reset {
		    background-color: #6c757d;
		    color: white;
		}

		.btn-reset:hover {
		    background-color: #5a6268;
		}
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f1f1f1;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

		.pagination {
		    display: flex;
		    justify-content: center;
		    gap: 10px;
		    margin-top: 24px;
		    flex-wrap: wrap;
		}

		.pagination a {
		    padding: 6px 10px;
		    text-decoration: none;
		    color: #1a73e8;
		    font-size: 14px;
		    border: none;
		}

		.pagination a:hover {
		    text-decoration: underline;
		}

		.pagination span {
		    font-size: 14px;
		    color: #555;
		    padding: 6px 10px;
		}
		
		.pagination a.active {
		    font-weight: bold;
		    color: #111;
		}
		
    </style>
</head>

<body>
	<nav th:replace="~{fragments/base :: navbar}"></nav>

<div class="container">

    <div class="top-bar">
        <h2>Room Types</h2>
        <a th:href="@{/roomtypes/new}" class="btn btn-primary">+ Add Room Type</a>
    </div>
	<form th:action="@{/roomtypes}" method="get" class="search-form">
	    <input type="text" name="keyword" th:value="${param.keyword}" placeholder="🔍 Search by name"/>
	    <input type="number" name="price" th:value="${param.price}" placeholder="💰 Max Price"/>
	    <input type="number" name="occupancy" th:value="${param.occupancy}" placeholder="👥 Min Occupancy"/>
	    <button type="submit" class="btn btn-primary">Search</button>
	    <a th:href="@{/roomtypes}" class="btn btn-reset">Reset</a>
	</form>
    <table>
        <thead>
        <tr>
			<th>Name</th>
            <th>Description</th>
            <th>Price / Night</th>
            <th>Max Occupancy</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
			<tr th:each="room : ${roomTypes}"
			    th:if="${room.roomTypeId != null}"
			    th:onclick="|window.location='rooms/byRoomId/' + ${room.roomTypeId}|"
			    style="cursor:pointer;">
				<td th:text="${room.typeName}"></td>
	            <td th:text="${room.description}"></td>
	            <td th:text="${room.pricePerNight}"></td>
	            <td th:text="${room.maxOccupancy}"></td>
				<td onclick="event.stopPropagation()">
				    <a th:href="@{'/roomtypes/edit/' + ${room.roomTypeId}}" 
				       class="btn btn-warning">Edit</a>
				</td>
        	</tr>
			<tr th:if="${roomTypes == null or #lists.isEmpty(roomTypes) or roomTypes[0].roomTypeId == null}">
			    <td colspan="5" class="empty-msg">No room types found</td>
			</tr>
        </tbody>
    </table>

    <!-- Pagination -->
	<div class="pagination" th:if="${totalPages > 1}">
	    <a th:if="${currentPage > 0}"
	       th:href="@{/roomtypes(page=${currentPage - 1}, keyword=${param.keyword}, price=${param.price}, occupancy=${param.occupancy})}">
	       « Prev
	    </a>
	    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
	        <a th:href="@{/roomtypes(page=${i}, keyword=${param.keyword}, price=${param.price}, occupancy=${param.occupancy})}"
	           th:text="${i + 1}"
	           th:classappend="${i == currentPage} ? ' active' : ''">
	        </a>
	    </span>
	    <a th:if="${currentPage < totalPages - 1}"
	       th:href="@{/roomtypes(page=${currentPage + 1}, keyword=${param.keyword}, price=${param.price}, occupancy=${param.occupancy})}">
	       Next »
	    </a>
	</div>

</div>
<footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
